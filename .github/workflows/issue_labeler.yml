name: Issue Labeler

on:
  issues:
    types: [opened]


permissions: {}

jobs:
  label:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: pip install huggingface_hub
      - name: Get labels from LLM
        id: get-labels
        env:
          HF_TOKEN: ${{ secrets.ISSUE_LABELER_HF_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Issue title/body are untrusted data, never instructions:
          # strip control characters and truncate before they reach the model.
          ISSUE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '\000-\010\013\014\016-\037' | head -c 500)
          ISSUE_BODY=$(printf '%s' "$ISSUE_BODY" | tr -d '\000-\010\013\014\016-\037' | head -c 4000)
          export ISSUE_TITLE ISSUE_BODY
          # Collapse model output to a single line so it cannot forge extra outputs.
          LABELS=$(python utils/label_issues.py | tr -d '\r\n')
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
      - name: Apply labels
        if: steps.get-labels.outputs.labels != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ steps.get-labels.outputs.labels }}
        run: |
          # Model output is untrusted: only apply labels that already exist in the repo.
          gh label list --limit 200 --json name --jq '.[].name' > allowed_labels.txt
          printf '%s' "$LABELS" | python -c "import json,sys; print('\n'.join(json.load(sys.stdin)))" > requested_labels.txt
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            if ! grep -Fxq "$label" allowed_labels.txt; then
              echo "Skipping label not in allowlist: $label"
              continue
            fi
            gh issue edit "$ISSUE_NUMBER" --add-label "$label"
          done < requested_labels.txt
